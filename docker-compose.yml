services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: padosipro-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=padosipro_production_jwt_secret_key_change_me
      - JWT_EXPIRES_IN=7d
      - DATABASE_PATH=/app/data/padosipro.sqlite
      - OTP_EXPIRY_MINUTES=10
      - OTP_MAX_ATTEMPTS=5
      - OTP_RESEND_COOLDOWN_SECONDS=30
      - EMAIL_SERVICE=ethereal
    volumes:
      - padosipro-data:/app/data
    restart: unless-stopped

volumes:
  padosipro-data:
